<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; font: 13px "Segoe UI", system-ui, sans-serif; color: #222; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #1565c0; color: #fff; }
  header img { width: 22px; height: 22px; }
  header b { flex: 1; font-size: 14px; }
  #status { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(255,255,255,.2); }
  section { padding: 8px 12px; border-bottom: 1px solid #eee; }
  label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  h4 { margin: 4px 0 6px; font-size: 11px; text-transform: uppercase; color: #777; letter-spacing: .04em; }
  .m { display: flex; gap: 8px; align-items: center; padding: 5px 0; }
  .m span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m small { color: #777; }
  button { border: 1px solid #1565c0; background: #fff; color: #1565c0; border-radius: 4px; padding: 3px 9px; cursor: pointer; }
  button:hover { background: #e8f1fc; }
  .empty { color: #888; padding: 4px 0; }
  footer { display: flex; justify-content: space-between; padding: 8px 12px; }
</style>
</head>
<body>
  <header><img src="icons/32.png" alt=""><b>YDM</b><span id="status">checking…</span></header>
  <section>
    <label><input type="checkbox" id="enabled"> Take over browser downloads</label>
    <label><input type="checkbox" id="overlay"> Show download button over videos</label>
  </section>
  <section>
    <h4>Media on this page</h4>
    <div id="media"><div class="empty">Nothing detected yet. Play a video.</div></div>
  </section>
  <footer>
    <button id="page">Download page video (yt-dlp)</button>
    <button id="open">Open YDM</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
